plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id 'com.github.jk1.dependency-license-report' version '3.1.4'
    id 'com.diffplug.spotless' version '8.10.2'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven { url 'https://jitpack.io' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"skyblock-auction-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	clientImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    clientImplementation "org.apache.kafka:kafka-clients:4.0.0"
    clientImplementation "com.github.jaron2668:SkyBlockSharedModels:v1.0.0"
    clientImplementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    clientImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2"
    clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    include "org.apache.kafka:kafka-clients:4.0.0"
    include "com.github.jaron2668:SkyBlockSharedModels:v1.0.0"
    include "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    include "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE.txt") //{
		// rename { "${it}_$projectName"}
	//}
}

// Generate a third-party license report.
licenseReport {
    outputDir = layout.buildDirectory.dir("licenses").get().asFile

    renderers = [
        new com.github.jk1.license.render.TextReportRenderer(
            "THIRD-PARTY-NOTICES.txt"
        )
    ]
}
// Include the generated third-party license file in the final JAR.
tasks.named("jar") {
    dependsOn tasks.named("generateLicenseReport")

    from(layout.buildDirectory.file("licenses/THIRD-PARTY-NOTICES.txt")) {
        into("META-INF")
    }

    from(layout.buildDirectory.dir("licenses")) {
        into("META-INF/licenses")
        include("**/*")
        exclude("THIRD-PARTY-NOTICES.txt")
    }
}
spotless {
    java {
        target 'src/**/*.java'

        licenseHeaderFile 'license-header.txt'
    }
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
